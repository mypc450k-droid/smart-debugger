name: Smart Debugger V18 package
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create consolidated V18 ZIP
        run: |
          rm -rf .git
          zip -qr SmartDebugger_V18.zip . -x '*.DS_Store'
      - name: Upload consolidated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SmartDebugger_V18
          path: SmartDebugger_V18.zip
